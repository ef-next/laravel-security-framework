name: Gates

# The quality gates of the framework as one reusable workflow. It is called by
#   ci.yml       on every push to main and every pull request, and by
#   release.yml  for every version tag, after the tag signature has been verified,
# so a release can only be published from a commit that passed exactly the gates
# main is held to — the same jobs, the same matrix, the same thresholds:
#   quality      – composer audit, Pint, PHPStan (PHP 8.3, highest deps)
#   tests        – PHP 8.3 / 8.4 / 8.5 × Laravel 13 × sqlite / pgsql / mysql / mariadb (highest deps)
#                  + PHP 8.3 × Laravel 13 × lowest deps on every database, line coverage ≥ 80 %
#   databases    – supported database versions (PHP 8.4, Laravel 13):
#                  PostgreSQL 14 / 16 / 17, MySQL 8.0 / 8.4, MariaDB 10.11 / 11.4 / 11 (latest)
#   mutation     – Pest mutation testing on the security core (sqlite), fails below --min=70;
#                  the full report is uploaded as an artifact
#   docs         – bin/docs-check (links, reference coverage, php blocks, translation
#                  headers) and every Mermaid diagram rendered with mermaid-cli
#   example      – examples/laravel-app materialised on a fresh Laravel skeleton with the
#                  framework installed from this checkout; its tests, anchor, verify and
#                  security:doctor must pass on SQLite and on PostgreSQL
# Actions are pinned to commit SHAs (the version is in the comment); bump them deliberately.

on:
  workflow_call:

permissions:
  contents: read

env:
  PGSQL_HOST: 127.0.0.1
  PGSQL_PORT: "5432"
  PGSQL_DATABASE: security
  PGSQL_USERNAME: security
  PGSQL_PASSWORD: secret
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: security
  # root: creating triggers with binary logging enabled needs SUPER (or log_bin_trust_function_creators).
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: root
  MARIADB_HOST: 127.0.0.1
  MARIADB_PORT: "3307"
  MARIADB_DATABASE: security
  MARIADB_USERNAME: root
  MARIADB_PASSWORD: root

jobs:
  quality:
    name: Audit, style and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit --no-interaction --abandoned=report
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.deps }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["13"]
        deps: [highest]
        db: [sqlite, pgsql, mysql, mariadb]
        include:
          - { php: "8.3", laravel: "13", deps: lowest, db: sqlite }
          - { php: "8.3", laravel: "13", deps: lowest, db: pgsql }
          - { php: "8.3", laravel: "13", deps: lowest, db: mysql }
          - { php: "8.3", laravel: "13", deps: lowest, db: mariadb }
    services:
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: security
          POSTGRES_USER: security
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security -d security"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: security
          MYSQL_USER: security
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: security
          MARIADB_USER: security
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DB_CONNECTION: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pcntl
          coverage: pcov
      - name: Install dependencies (Laravel ${{ matrix.laravel }}, ${{ matrix.deps }})
        run: |
          composer update --no-interaction --no-progress --prefer-dist \
            --with "laravel/framework:^${{ matrix.laravel }}.0" \
            ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
          for package in laravel/framework orchestra/testbench pestphp/pest; do
            composer show "$package" | grep -E '^(name |versions)'
          done
      - run: vendor/bin/pest --colors=never --coverage --min=80

  databases:
    name: Database versions (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "PostgreSQL 14", db: pgsql,   pgsql: "14-alpine", mysql: "8.4", mariadb: "11" }
          - { name: "PostgreSQL 17", db: pgsql,   pgsql: "17-alpine", mysql: "8.4", mariadb: "11" }
          - { name: "MySQL 8.0",     db: mysql,   pgsql: "16-alpine", mysql: "8.0", mariadb: "11" }
          - { name: "MariaDB 10.11", db: mariadb, pgsql: "16-alpine", mysql: "8.4", mariadb: "10.11" }
          - { name: "MariaDB 11.4",  db: mariadb, pgsql: "16-alpine", mysql: "8.4", mariadb: "11.4" }
    services:
      pgsql:
        image: postgres:${{ matrix.pgsql }}
        env:
          POSTGRES_DB: security
          POSTGRES_USER: security
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security -d security"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: security
          MYSQL_USER: security
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_DATABASE: security
          MARIADB_USER: security
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DB_CONNECTION: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pcntl
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist --with "laravel/framework:^13.0"
      - run: vendor/bin/pest --colors=never

  mutation:
    name: Mutation testing (core, min 70 %)
    runs-on: ubuntu-latest
    # 2-vCPU runners (private repositories) need about 50 minutes for ~2700 mutants.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pcntl
          coverage: pcov
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Mutation testing
        run: |
          mkdir -p build
          set -o pipefail
          bin/mutate --min=70 2>&1 | tee build/mutation-report.txt
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: build/mutation-report.txt
          if-no-files-found: warn

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - name: Links, reference coverage, php blocks, translation headers
        run: python3 bin/docs-check
      - name: Render every Mermaid diagram (Node and npx are preinstalled on the runner)
        run: |
          echo '{"args": ["--no-sandbox", "--disable-gpu"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/diagrams
          status=0
          for page in docs/en/diagrams/*.md; do
            name=$(basename "$page" .md)
            if npx --yes -p @mermaid-js/mermaid-cli@12 mmdc -q -p /tmp/puppeteer.json -i "$page" -o "/tmp/diagrams/$name.md" -e svg; then
              echo "✓ $page"
            else
              echo "::error file=$page::Mermaid block does not render"
              status=1
            fi
          done
          ls /tmp/diagrams
          exit $status

  example:
    name: Example application (Laravel skeleton + framework, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]
    services:
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: security
          POSTGRES_USER: security
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security -d security"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_CONNECTION: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none
      - name: Create the application, install the framework, run its tests (on ${{ matrix.db }}) and the operator commands
        run: examples/laravel-app/install.sh "$RUNNER_TEMP/example-app"
