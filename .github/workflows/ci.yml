name: CI

# Every push to main and every pull request runs the quality gates (gates.yml,
# shared with the Release workflow). There is no experimental matrix: every
# supported combination is a gate, and nothing else runs.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a running CI (the mutation job alone
# takes ~50 minutes on 2-vCPU runners); releases are never cancelled this way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

