name: Release

# Runs when a version tag is pushed (v1.0.0-alpha.2, v1.2.0, ...). The tag is
# created and signed by a maintainer (docs/maintainers/releasing.md); this workflow turns it
# into a verifiable release:
#
#   0. the tag must be annotated and carry a signature that verifies against the
#      trust root committed in the repository (.github/allowed_signers for SSH
#      keys, .github/release-keys.gpg for OpenPGP keys); otherwise nothing runs
#   1. the complete quality gates on the tagged commit — the reusable gates.yml that CI
#      runs on main (audit, Pint, PHPStan, test matrix on four databases, coverage, mutation)
#   2. a source archive straight from git (deterministic for a given tag) and its SHA-256
#   3. an SBOM of the runtime dependency tree (SPDX and CycloneDX, generated by syft)
#   4. a build provenance attestation (SLSA) for the archive and the SBOMs, signed by GitHub —
#      public repositories only; GitHub offers attestations for private and internal
#      repositories on GitHub Enterprise Cloud alone, so the step is skipped elsewhere
#   5. a GitHub release with the CHANGELOG section as notes and all of the above attached
#
# Verify a download with `sha256sum -c SHA256SUMS` (and, for a public repository,
# `gh attestation verify <file> --repo <owner>/<repo>`); verify the tag with
# `git verify-tag <tag>` against the same trust root. Actions are pinned to commit
# SHAs (the version is in the comment).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    name: Tag is annotated and signed by a maintainer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Annotated tag
        run: |
          type=$(git cat-file -t "refs/tags/$TAG")
          [ "$type" = "tag" ] || { echo "::error::$TAG is a lightweight tag ($type); releases need an annotated, signed tag (git tag -s)."; exit 1; }
      - name: Trust root from the repository
        run: |
          found=0
          if [ -s .github/allowed_signers ] && grep -qve '^\s*#' -e '^\s*$' .github/allowed_signers; then
            git config gpg.ssh.allowedSignersFile "$PWD/.github/allowed_signers"
            echo "SSH signers: $(grep -cve '^\s*#' -e '^\s*$' .github/allowed_signers)"
            found=1
          fi
          if [ -s .github/release-keys.gpg ]; then
            gpg --batch --import .github/release-keys.gpg
            gpg --batch --list-keys --with-colons | awk -F: '/^fpr/ {print $10 ":6:"}' | gpg --batch --import-ownertrust
            echo "OpenPGP keys: $(gpg --batch --list-keys --with-colons | grep -c '^pub')"
            found=1
          fi
          [ "$found" = 1 ] || { echo "::error::No trust root: commit the maintainers' public keys to .github/allowed_signers (SSH) or .github/release-keys.gpg (OpenPGP). See docs/maintainers/releasing.md."; exit 1; }
      - name: Signature verifies against the trust root
        run: |
          git verify-tag --raw "$TAG" 2> verify.log || { cat verify.log; echo "::error::The signature of $TAG does not verify against the committed trust root."; exit 1; }
          cat verify.log
          # git verify-tag exits 0 for a trusted OpenPGP key of any trust level; insist on a good, fully trusted signature.
          if grep -q 'GOODSIG' verify.log; then
            grep -Eq 'TRUST_(FULLY|ULTIMATE)' verify.log || { echo "::error::OpenPGP signature is good but the key is not the committed release key."; exit 1; }
          fi

  gates:
    name: Gates
    needs: verify-tag
    # The same reusable workflow CI runs on main: full database and dependency matrix,
    # coverage floor, mutation gate. A tag cannot be released from a commit that
    # would not pass CI, whatever main looked like when it was pushed.
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  release:
    name: Archive, SBOM, provenance, GitHub release
    needs: [verify-tag, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - name: Check that the tag matches the changelog
        run: |
          version="${TAG#v}"
          grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md || {
            echo "CHANGELOG.md has no section '## ${version}'"; exit 1; }

      - name: Source archive
        run: |
          mkdir -p build/release
          git archive --format=tar.gz --prefix="security-framework-${TAG}/" \
            -o "build/release/security-framework-${TAG}.tar.gz" "${TAG}"

      - name: Runtime dependency tree for the SBOM
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev
          rm -f composer.lock   # syft would otherwise also list the dev tree from the lock file

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: build/release/security-framework-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/release/security-framework-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: build/release
        run: sha256sum security-framework-* > SHA256SUMS

      - name: Build provenance attestation (public repositories only)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/security-framework-*.tar.gz
            build/release/security-framework-*.json

      - name: Release notes from the changelog
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { printing = (index($0, "## " v " ") == 1 || $0 == "## " v) ; if (printing) next }
            printing { print }
          ' CHANGELOG.md > build/release-notes.md
          {
            echo
            echo "---"
            if [ "$VISIBILITY" = "public" ]; then
              echo "Assets: source archive, \`SHA256SUMS\`, SBOM (SPDX + CycloneDX), build provenance attestation."
              echo "Verify: \`gh attestation verify security-framework-${TAG}.tar.gz --repo ${GITHUB_REPOSITORY}\` and \`sha256sum -c SHA256SUMS\`."
            else
              echo "Assets: source archive, \`SHA256SUMS\`, SBOM (SPDX + CycloneDX)."
              echo "Verify: \`sha256sum -c SHA256SUMS\`; the tag with \`git verify-tag ${TAG}\` against \`.github/allowed_signers\` / \`.github/release-keys.gpg\`."
              echo "No build provenance attestation: GitHub offers attestations for private repositories on GitHub Enterprise Cloud only."
            fi
          } >> build/release-notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file build/release-notes.md $prerelease \
            build/release/security-framework-*.tar.gz \
            build/release/security-framework-*.json \
            build/release/SHA256SUMS
